<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>you shouldn't be here</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; }
body {
  background: #050508; color: #c0c0c0;
  font-family: 'Times New Roman', serif;
  user-select: none; -webkit-user-select: none;
  position: fixed; inset: 0;
}
canvas { display: block; }
.hidden { display: none !important; }

#three-container { position: fixed; inset: 0; z-index: 0; }
#glitch-overlay { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
#face-overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.02s; }
#face-overlay.active { opacity: 1; }
#blood-overlay { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
#blood-overlay.active { opacity: 1; }
#scanlines {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0,0,0,0.2) 1px, rgba(0,0,0,0.2) 3px);
}
#vignette {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 100%);
  transition: background 1s;
}

#ui-layer { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
#ui-layer.clickable { pointer-events: auto; }
#shake-layer { position: fixed; inset: 0; z-index: 90; pointer-events: none; }
#bsod-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: #012; color: #aab; font-family: 'Consolas',monospace; padding: 10vw;
  text-align: center;
}
#bsod-overlay.active { display: flex; pointer-events: auto; }
#flash-overlay { position: fixed; inset: 0; z-index: 98; pointer-events: none; opacity: 0; transition: opacity 0.02s; }
#flash-overlay.active { opacity: 1; }

.fake-popup {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  background: #0a0a0f; border: 1px solid #2a2a3a;
  padding: clamp(16px,4vw,30px);
  max-width: min(400px, 85vw);
  width: 85vw;
  box-shadow: 0 0 100px rgba(80,0,0,0.3);
  font-size: clamp(13px,1.8vw,15px);
  line-height: 1.7; color: #909098;
  font-family: 'Times New Roman', serif;
  z-index: 21;
}
.fake-popup.danger { border-color: #4a1010; box-shadow: 0 0 100px rgba(120,0,0,0.4); }
.fake-popup.danger h3 { color: #7a2020; }
.fake-popup h3 { font-weight: normal; margin-bottom: 12px; font-size: clamp(14px,2vw,17px); letter-spacing: 0.1em; color: #7a7a7a; }
.fake-popup .btn-row { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; flex-wrap: wrap; }
.fake-popup button {
  background: #16161e; border: 1px solid #3a3a4a; color: #a0a0a0;
  padding: clamp(8px,2vw,12px) clamp(14px,3vw,20px);
  font-family: inherit; font-size: clamp(13px,1.8vw,14px);
  cursor: pointer; transition: 0.1s; min-height: 44px; min-width: 60px;
  -webkit-tap-highlight-color: transparent;
}
.fake-popup button:active { background: #262632; border-color: #5a5a6a; }
#corner-counter {
  position: fixed; bottom: 8px; left: 8px;
  color: rgba(40,40,40,0.06);
  font-family: monospace; font-size: 9px; z-index: 5; pointer-events: none;
}

@media (max-width: 600px) {
  .fake-popup { width: 92vw; padding: 18px; }
}
</style>
</head>
<body>

<div id="three-container"></div>
<canvas id="glitch-overlay"></canvas>
<canvas id="face-overlay"></canvas>
<canvas id="blood-overlay"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="ui-layer"></div>
<div id="shake-layer"></div>
<div id="bsod-overlay"><div id="bsod-text"></div></div>
<div id="flash-overlay"></div>
<div id="corner-counter">0</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  let AC = null, audioReady = false;
  let clicks = 0, keys = 0, scares = 0;
  let idleSec = 0, idleTimer = null, lastAction = Date.now();
  let scareCD = 0, fearLevel = 0;
  let bsodActive = false;
  let isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

  const NIGHTMARES = [
    "you forgot something important", "someone is behind you", "this room has no doors",
    "you've been here before", "they know you're awake", "the reflection didn't move",
    "your name was never yours", "it's been watching since you arrived",
    "the exit was never real", "you are being recorded", "it's smiling at you",
    "don't blink", "it's closer now", "there's something in the corner",
    "it's wearing someone else's face", "you let it in"
  ];

  /* ========== CANVAS ========== */
  const faceCanvas = document.getElementById('face-overlay');
  const faceCtx = faceCanvas.getContext('2d');
  const bloodCanvas = document.getElementById('blood-overlay');
  const bloodCtx = bloodCanvas.getContext('2d');

  function resizeAll() {
    faceCanvas.width = bloodCanvas.width = window.innerWidth;
    faceCanvas.height = bloodCanvas.height = window.innerHeight;
  }
  resizeAll();
  window.addEventListener('resize', resizeAll);

  function drawFace(w, h, intensity) {
    faceCtx.clearRect(0, 0, w, h);
    faceCtx.fillStyle = '#000';
    faceCtx.fillRect(0, 0, w, h);
    const cx = w/2, cy = h/2;
    const s = Math.min(w, h) * 0.42;
    faceCtx.save();
    faceCtx.translate(cx, cy);
    faceCtx.beginPath();
    faceCtx.ellipse(0, 0, s*1.2, s*1.5, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#14141e';
    faceCtx.fill();
    for (let side = -1; side <= 1; side += 2) {
      faceCtx.beginPath();
      faceCtx.ellipse(side*s*0.45, -s*0.25, s*0.28, s*0.35, 0, 0, Math.PI*2);
      faceCtx.fillStyle = '#050505'; faceCtx.fill();
      faceCtx.beginPath();
      faceCtx.arc(side*s*0.45+side*s*0.06, -s*0.22+s*0.03, s*0.1, 0, Math.PI*2);
      faceCtx.fillStyle = `rgba(180,180,180,${0.6+Math.random()*0.4})`;
      faceCtx.fill();
      faceCtx.strokeStyle = '#3a0a0a'; faceCtx.lineWidth = 1.5;
      for (let v = 0; v < 10; v++) {
        const ang = Math.random()*Math.PI*2, len = s*(0.2+Math.random()*0.3);
        faceCtx.beginPath();
        faceCtx.moveTo(side*s*0.45, -s*0.25);
        faceCtx.quadraticCurveTo(side*s*0.45+Math.cos(ang)*len*0.5+(Math.random()-0.5)*s*0.2, -s*0.25+Math.sin(ang)*len*0.5+(Math.random()-0.5)*s*0.2, side*s*0.45+Math.cos(ang)*len, -s*0.25+Math.sin(ang)*len);
        faceCtx.stroke();
      }
    }
    faceCtx.beginPath();
    faceCtx.ellipse(0, s*0.05, s*0.06, s*0.14, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#000'; faceCtx.fill();
    const mY = s*0.4;
    faceCtx.beginPath();
    faceCtx.ellipse(0, mY, s*0.7, s*0.2, 0, 0, Math.PI);
    faceCtx.strokeStyle = '#1a1a1a'; faceCtx.lineWidth = 4; faceCtx.stroke();
    for (let t = -7; t <= 7; t++) {
      const tx = t*s*0.065;
      faceCtx.fillStyle = '#d0d0d0';
      faceCtx.fillRect(tx-s*0.02, mY-s*0.07-Math.abs(Math.sin(t))*s*0.01, s*0.04, s*0.07+Math.sin(t*1.5)*s*0.02);
      faceCtx.strokeStyle = '#333'; faceCtx.lineWidth = 0.5;
      faceCtx.strokeRect(tx-s*0.02, mY-s*0.07-Math.abs(Math.sin(t))*s*0.01, s*0.04, s*0.07+Math.sin(t*1.5)*s*0.02);
    }
    for (let t = -6; t <= 6; t++) {
      const tx = t*s*0.065;
      faceCtx.fillStyle = '#c8c8c8';
      faceCtx.fillRect(tx-s*0.017, mY+2, s*0.035, s*0.05);
      faceCtx.strokeStyle = '#333'; faceCtx.lineWidth = 0.5;
      faceCtx.strokeRect(tx-s*0.017, mY+2, s*0.035, s*0.05);
    }
    for (let d = 0; d < 35; d++) {
      const dx = (Math.random()-0.5)*s*2.8, dy = (Math.random()-0.5)*s*3;
      faceCtx.fillStyle = `rgba(0,0,0,${Math.random()*0.7})`;
      faceCtx.fillRect(dx, dy, Math.random()*s*0.4+s*0.05, Math.random()*6+2);
    }
    if (intensity > 1) {
      for (let d = 0; d < 15; d++) {
        faceCtx.fillStyle = `rgba(80,0,0,${0.2+Math.random()*0.5})`;
        faceCtx.beginPath();
        faceCtx.ellipse((Math.random()-0.5)*s*2, s*0.3+Math.random()*s*0.8, 2+Math.random()*4, 3+Math.random()*14, 0, 0, Math.PI*2);
        faceCtx.fill();
      }
    }
    faceCtx.restore();
  }

  function drawFigure(w, h) {
    faceCtx.clearRect(0, 0, w, h);
    faceCtx.fillStyle = '#000'; faceCtx.fillRect(0, 0, w, h);
    if (isMobile) { w = Math.min(w, 500); h = Math.min(h, 800); } // cap for perf
    const cx = w/2, cy = h/2 + h*0.1;
    const s = Math.min(w, h) * 0.35;
    faceCtx.fillStyle = '#08080a';
    faceCtx.beginPath();
    faceCtx.moveTo(cx-s*0.35, cy+s*0.9);
    faceCtx.lineTo(cx-s*0.55, cy-s*0.3);
    faceCtx.quadraticCurveTo(cx, cy-s*1.5, cx+s*0.55, cy-s*0.3);
    faceCtx.lineTo(cx+s*0.35, cy+s*0.9);
    faceCtx.closePath(); faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy-s*0.8, s*0.28, s*0.35, 0, 0, Math.PI*2);
    faceCtx.fill();
    faceCtx.fillStyle = '#000';
    faceCtx.beginPath();
    faceCtx.ellipse(cx-s*0.12, cy-s*0.85, s*0.07, s*0.1, 0, 0, Math.PI*2);
    faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.ellipse(cx+s*0.12, cy-s*0.85, s*0.07, s*0.1, 0, 0, Math.PI*2);
    faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy-s*0.65, s*0.05, s*0.08, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#000'; faceCtx.fill();
    faceCtx.strokeStyle = '#08080a'; faceCtx.lineWidth = s*0.15; faceCtx.lineCap = 'round';
    faceCtx.beginPath();
    faceCtx.moveTo(cx-s*0.5, cy-s*0.2);
    faceCtx.quadraticCurveTo(cx-s*1.1, cy+s*0.5, cx-s*0.9, cy+s*0.3);
    faceCtx.stroke();
    faceCtx.beginPath();
    faceCtx.moveTo(cx+s*0.5, cy-s*0.2);
    faceCtx.quadraticCurveTo(cx+s*1.1, cy+s*0.5, cx+s*0.9, cy+s*0.3);
    faceCtx.stroke();
    for (let d = 0; d < 30; d++) {
      faceCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.04})`;
      faceCtx.fillRect(Math.random()*w, Math.random()*h, Math.random()*200+30, Math.random()*3+1);
    }
  }

  function drawEye(w, h) {
    faceCtx.clearRect(0, 0, w, h);
    faceCtx.fillStyle = '#000'; faceCtx.fillRect(0, 0, w, h);
    const cx = w/2, cy = h/2, s = Math.min(w, h)*0.4;
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy, s*0.8, s*0.6, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#0a0a0a'; faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy, s*0.6, s*0.45, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#e0d8d0'; faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.arc(cx, cy, s*0.3, 0, Math.PI*2);
    faceCtx.fillStyle = '#3a3028'; faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.arc(cx, cy, s*0.15, 0, Math.PI*2);
    faceCtx.fillStyle = '#000'; faceCtx.fill();
    faceCtx.strokeStyle = '#4a1010'; faceCtx.lineWidth = 1.5;
    for (let v = 0; v < 15; v++) {
      const ang = Math.random()*Math.PI*2, len = s*(0.3+Math.random()*0.3);
      faceCtx.beginPath();
      faceCtx.moveTo(cx, cy);
      faceCtx.quadraticCurveTo(cx+Math.cos(ang)*len*0.5+(Math.random()-0.5)*s*0.2, cy+Math.sin(ang)*len*0.5+(Math.random()-0.5)*s*0.2, cx+Math.cos(ang)*len, cy+Math.sin(ang)*len);
      faceCtx.stroke();
    }
  }

  function addBlood() {
    const w = bloodCanvas.width, h = bloodCanvas.height;
    bloodCtx.clearRect(0, 0, w, h);
    for (let i = 0; i < 25+scares*3; i++) {
      const x = Math.random()*w, y = Math.random()*h;
      bloodCtx.strokeStyle = `rgba(80,0,0,${0.2+Math.random()*0.3})`;
      bloodCtx.lineWidth = 2+Math.random()*6; bloodCtx.lineCap = 'round';
      bloodCtx.beginPath();
      bloodCtx.moveTo(x, y);
      bloodCtx.quadraticCurveTo(x+(Math.random()-0.5)*20, y+20+Math.random()*60, x+(Math.random()-0.5)*15, y+30+Math.random()*80);
      bloodCtx.stroke();
      bloodCtx.beginPath();
      bloodCtx.arc(x+(Math.random()-0.5)*15, y+30+Math.random()*80, 2+Math.random()*4, 0, Math.PI*2);
      bloodCtx.fill();
    }
  }

  /* ========== MOBILE FEATURES ========== */
  // Vibration on scares
  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 200); } catch(e) {}
  }

  // Back button trap
  let backTraps = 0;
  window.addEventListener('popstate', (e) => {
    backTraps++;
    history.pushState(null, '', location.href);
    if (backTraps === 1) {
      popup({t:'trying to leave?', b:'there is no way back.\nthe door is gone.', btn:'...', danger:true});
    } else if (backTraps === 2) {
      trigger('face');
      popup({t:'stop', b:'you cannot go back.\nit will not let you.', btn:'i understand', danger:true});
    } else {
      trigger('figure');
      bsod();
    }
  });
  history.pushState(null, '', location.href);

  // Battery API fake
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      let warned = false;
      b.addEventListener('levelchange', () => {
        if (b.level < 0.3 && !warned) {
          warned = true;
          setTimeout(() => popup({t:'BATTERY DRAINING', b:'your battery is dropping fast.\nbut that\'s not what\'s powering this page.', btn:'...', danger:true}), 20000);
        }
      });
    }).catch(()=>{});
  }

  // Ambient light (if available, adjust horror)
  if ('AmbientLightSensor' in window) {
    try {
      const sensor = new AmbientLightSensor();
      sensor.addEventListener('reading', () => {
        if (sensor.illuminance < 10 && fearLevel < 5) {
          // Dark room = more aggressive
          fearLevel = Math.max(fearLevel, 3);
        }
      });
      sensor.start();
    } catch(e) {}
  }

  // Screen wake lock attempt
  try {
    if (navigator.wakeLock) {
      navigator.wakeLock.request('screen').catch(()=>{});
    }
  } catch(e) {}

  // Orientation lock hint
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(()=>{});
    }
  } catch(e) {}

  // Gyroscope - device orientation horror
  let prevGamma = 0, prevBeta = 0;
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
      const g = e.gamma || 0, b = e.beta || 0;
      if (Math.abs(g - prevGamma) > 30 || Math.abs(b - prevBeta) > 30) {
        // Sudden phone movement = scare opportunity
        if (Math.random() > 0.7 && scares > 2) {
          flashNow('#fff');
          playScareSound();
          screenShake(4);
        }
      }
      prevGamma = g; prevBeta = b;
    });
  }

  /* ========== JUMPSCARES ========== */
  function trigger(type) {
    if (scareCD > Date.now()) return;
    scareCD = Date.now() + (isMobile ? 2500 : 2000);
    scares++; fearLevel = Math.min(fearLevel+1, 35);
    const w = faceCanvas.width, h = faceCanvas.height;
    flashNow(Math.random()>0.3?'#fff':'#800', 0.6);
    if (!type || type === 'face') drawFace(w, h, fearLevel);
    else if (type === 'figure') drawFigure(w, h);
    else if (type === 'eye') drawEye(w, h);
    else if (type === 'staticjump') {
      faceCtx.clearRect(0, 0, w, h);
      for (let i = 0; i < 600; i++) {
        faceCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.3})`;
        faceCtx.fillRect(Math.random()*w, Math.random()*h, Math.random()*50+5, Math.random()*3+1);
      }
    }
    faceCanvas.classList.add('active');
    screenShake(6 + fearLevel);
    playScareSound();
    vibrate(isMobile ? 300 : 0);

    if (Math.random() > 0.4) {
      document.getElementById('blood-overlay').classList.add('active');
      addBlood();
      setTimeout(() => document.getElementById('blood-overlay').classList.remove('active'), 3000+(isMobile?1000:0));
    }
    if (scares > 2 && Math.random() > 0.5) {
      const el = document.getElementById('static-overlay') || (()=>{
        const d = document.createElement('div'); d.id = 'static-overlay';
        d.style.cssText = 'position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 0.1s';
        document.body.appendChild(d); return d;
      })();
      el.style.background = `url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(#n)" opacity="0.8"/></svg>')`;
      el.style.opacity = '0.8';
      setTimeout(() => el.style.opacity = '0', 400+(isMobile?200:0));
    }
    setTimeout(() => faceCanvas.classList.remove('active'), 120+Math.random()*80);
  }

  function randomJumpScare() {
    const r = Math.random();
    if (r < 0.35) trigger('face');
    else if (r < 0.6) trigger('figure');
    else if (r < 0.8) trigger('eye');
    else trigger('staticjump');
  }

  let currentFlash = null;
  const SUBLIMINALS = ['RUN','GO NOW','BEHIND YOU','DON\'T BLINK','IT SEES YOU','TOO LATE','GET OUT','IT\'S HERE'];
  function flashNow(color, intensity) {
    const el = document.getElementById('flash-overlay');
    el.style.background = color || '#fff';
    el.style.opacity = intensity || '0.5';
    if (Math.random()>0.7 && fearLevel>3) {
      el.textContent = SUBLIMINALS[Math.floor(Math.random()*SUBLIMINALS.length)];
      el.style.cssText += `display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:clamp(40px,10vw,80px);color:#000;letter-spacing:0.3em;z-index:98;`;
    } else {
      el.textContent = '';
    }
    el.classList.add('active');
    if (currentFlash) clearTimeout(currentFlash);
    currentFlash = setTimeout(() => {
      el.style.opacity = '0';
      setTimeout(() => { el.classList.remove('active'); el.textContent = ''; currentFlash = null; }, 50);
    }, 50+Math.random()*80);
  }

  const shakeEl = document.getElementById('shake-layer');
  function screenShake(intensity) {
    let count = 0;
    const max = Math.min(intensity*2, 30);
    const interval = setInterval(() => {
      shakeEl.style.transform = `translate(${(Math.random()-0.5)*intensity*3}px,${(Math.random()-0.5)*intensity*3}px)`;
      if (count++ > max) {
        clearInterval(interval);
        shakeEl.style.transform = 'translate(0,0)';
        if (Math.random() > 0.7 && intensity > 8) setTimeout(() => screenShake(intensity*0.3), 200);
      }
    }, 25);
  }

  /* ========== AUDIO ========== */
  function initAudio() {
    if (AC) return;
    AC = new (window.AudioContext || window.webkitAudioContext)();
    // Resume suspended context on mobile
    if (AC.state === 'suspended') AC.resume();

    [19, 33, 47].forEach((freq, i) => {
      const o = AC.createOscillator();
      o.type = i === 1 ? 'triangle' : 'sine';
      o.frequency.value = freq;
      const g = AC.createGain();
      g.gain.setValueAtTime(0, AC.currentTime);
      g.gain.linearRampToValueAtTime(0.12 - i*0.03, AC.currentTime + 6);
      const f = AC.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 90 + i*20;
      o.connect(f); f.connect(g); g.connect(AC.destination);
      o.start();
    });

    const nb = AC.createBuffer(1, AC.sampleRate*4, AC.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random()*2-1)*0.015;
    const ns = AC.createBufferSource();
    ns.buffer = nb; ns.loop = true;
    const ng = AC.createGain();
    ng.gain.setValueAtTime(0, AC.currentTime);
    ng.gain.linearRampToValueAtTime(0.06, AC.currentTime + 8);
    const nf = AC.createBiquadFilter();
    nf.type = 'lowpass'; nf.frequency.value = 600;
    ns.connect(nf); nf.connect(ng); ng.connect(AC.destination);
    ns.start();

    scheduleLullaby();
    scheduleSting();
    scheduleHallucinations();
    startFeedback();
    audioReady = true;
  }

  function scheduleLullaby() {
    if (!AC) return;
    setTimeout(() => {
      if (!AC) return;
      try {
        const notes = [262, 294, 330, 349, 392, 349, 330, 294];
        const corrupted = notes.map(n => n + (Math.random()-0.5)*100);

          g.gain.linearRampToValueAtTime(0.04, AC.currentTime + i*0.4 + 0.05);
          g.gain.linearRampToValueAtTime(0, AC.currentTime + i*0.4 + 0.35);
          o.connect(g); g.connect(AC.destination);
          o.start(AC.currentTime + i*0.4);
          o.stop(AC.currentTime + i*0.4 + 0.4);
