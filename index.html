<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>you shouldn't be here</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
body {
  background: #000;
  color: #c0c0c0;
  font-family: 'Times New Roman', serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
}
canvas { display: block; }
#three-container {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 0;
}
#glitch-overlay {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 1;
  pointer-events: none;
  mix-blend-mode: screen;
}
#face-overlay {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.02s;
}
#face-overlay.active { opacity: 1; }
#static-overlay {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 3;
  pointer-events: none;
  opacity: 0;
}
#static-overlay.active { opacity: 0.8; }
#scanlines {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 3;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0,0,0,0.2) 1px, rgba(0,0,0,0.2) 3px);
}
#vignette {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 3;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,1) 100%);
}
#blood-overlay {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 4;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
#blood-overlay.active { opacity: 1; }
#ui-layer {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 5;
  pointer-events: none;
}
#ui-layer.clickable { pointer-events: auto; }
#shake-layer {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 90;
  pointer-events: none;
}
#bsod-overlay {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 100;
  pointer-events: none;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #012;
  color: #aab;
  font-family: 'Consolas', monospace;
  padding: 40px;
}
#bsod-overlay.active { display: flex; pointer-events: auto; }
#flash-overlay {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 98;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.02s;
}
#flash-overlay.active { opacity: 1; }
.fake-popup {
  position: absolute;
  background: #0a0a0f;
  border: 1px solid #2a2a3a;
  padding: 20px 30px;
  max-width: 420px;
  box-shadow: 0 0 100px rgba(80,0,0,0.3);
  font-size: 14px;
  line-height: 1.7;
  color: #909098;
  font-family: 'Times New Roman', serif;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 12;
}
.fake-popup.danger { border-color: #4a1010; box-shadow: 0 0 100px rgba(120,0,0,0.4); }
.fake-popup.danger h3 { color: #7a2020; }
.fake-popup h3 { font-weight: normal; margin-bottom: 12px; font-size: 15px; letter-spacing: 0.1em; color: #7a7a7a; }
.fake-popup .btn-row { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
.fake-popup button {
  background: #16161e; border: 1px solid #3a3a4a; color: #a0a0a0;
  padding: 6px 18px; font-family: inherit; font-size: 13px; cursor: pointer; transition: 0.1s;
}
.fake-popup button:hover { background: #262632; border-color: #5a5a6a; }
#corner-counter {
  position: fixed; bottom: 10px; left: 10px;
  color: rgba(40,40,40,0.08);
  font-family: monospace; font-size: 10px; z-index: 5;
  pointer-events: none;
}
#story-overlay {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 50;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(5,5,8,0.97);
  padding: 8vh 10vw;
  pointer-events: auto;
}
#story-overlay.active {
  display: flex;
}
#story-text {
  max-width: 700px;
  font-size: clamp(16px, 1.6vw, 22px);
  line-height: 1.9;
  color: #808080;
  font-family: 'Times New Roman', serif;
  transition: color 0.5s;
  text-align: left;
}
#story-text .corrupted {
  color: #4a2020;
  text-shadow: 0 0 8px rgba(80,0,0,0.3);
  transition: all 0.3s;
}
#story-text .glitched {
  letter-spacing: -0.05em;
  opacity: 0.6;
  filter: blur(0.5px);
}
#story-progress {
  position: fixed;
  bottom: 0; left: 0;
  height: 2px;
  background: rgba(60,0,0,0.3);
  z-index: 51;
  transition: width 0.5s;
  width: 0%;
}
#story-skip {
  position: fixed; top: 20px; right: 30px;
  color: rgba(60,60,60,0.2);
  font-family: monospace; font-size: 12px; z-index: 51;
  cursor: pointer; pointer-events: auto;
  letter-spacing: 0.2em;
}
#story-skip:hover { color: rgba(100,100,100,0.4); }
</style>
</head>
<body>

<div id="three-container"></div>
<canvas id="glitch-overlay"></canvas>
<canvas id="face-overlay"></canvas>
<canvas id="blood-overlay"></canvas>
<div id="static-overlay"></div>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="ui-layer"></div>
<div id="shake-layer"></div>
<div id="bsod-overlay"><div id="bsod-text"></div></div>
<div id="flash-overlay"></div>
<div id="corner-counter">0</div>
<div id="story-overlay">
  <div id="story-text"></div>
  <div id="story-progress"></div>
  <div id="story-skip">x</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  /* ========== STATE ========== */
  let AC = null, audioReady = false;
  let clicks = 0, keys = 0, moves = 0, scares = 0;
  let idleSec = 0, idleTimer = null, lastAction = Date.now();
  let scareCD = 0, fearLevel = 0;
  let bsodActive = false;

  const NIGHTMARES = [
    "it's right behind you", "you are being watched", "don't turn around",
    "it can smell your fear", "your reflection is smiling", "it's in the room with you",
    "you let it in", "it wears your face", "it knows your name",
    "there's someone in your house", "it's been following you for days",
    "your eyes are next", "it feeds on fear", "the exit is gone",
    "you've been dead for hours", "it's learning your voice"
  ];

  /* ========== CANVAS HELPERS ========== */
  const faceCanvas = document.getElementById('face-overlay');
  const faceCtx = faceCanvas.getContext('2d');
  const bloodCanvas = document.getElementById('blood-overlay');
  const bloodCtx = bloodCanvas.getContext('2d');

  function resizeAll() {
    faceCanvas.width = bloodCanvas.width = window.innerWidth;
    faceCanvas.height = bloodCanvas.height = window.innerHeight;
  }
  resizeAll();
  window.addEventListener('resize', resizeAll);

  /* --- DRAW DISTORTED FACE (max horror) --- */
  function drawFace(w, h, intensity) {
    faceCtx.clearRect(0, 0, w, h);
    faceCtx.fillStyle = '#000';
    faceCtx.fillRect(0, 0, w, h);

    const cx = w/2, cy = h/2;
    const s = Math.min(w, h) * 0.45;

    faceCtx.save();
    faceCtx.translate(cx, cy);

    // Head
    faceCtx.beginPath();
    faceCtx.ellipse(0, 0, s*1.2, s*1.5, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#14141e';
    faceCtx.fill();

    // Eye sockets
    for (let side = -1; side <= 1; side += 2) {
      faceCtx.beginPath();
      faceCtx.ellipse(side*s*0.45, -s*0.25, s*0.25, s*0.32, 0, 0, Math.PI*2);
      faceCtx.fillStyle = '#050505';
      faceCtx.fill();
      // Glowing pupils
      faceCtx.beginPath();
      faceCtx.arc(side*s*0.45 + side*s*0.06, -s*0.22 + s*0.03, s*0.1, 0, Math.PI*2);
      faceCtx.fillStyle = `rgba(180,180,180,${0.6 + Math.random()*0.4})`;
      faceCtx.fill();
      // Red veins
      faceCtx.strokeStyle = '#3a0a0a';
      faceCtx.lineWidth = 1.5;
      for (let v = 0; v < 8; v++) {
        const ang = Math.random() * Math.PI * 2;
        const len = s * 0.2 + Math.random() * s * 0.3;
        faceCtx.beginPath();
        faceCtx.moveTo(side*s*0.45, -s*0.25);
        faceCtx.quadraticCurveTo(
          side*s*0.45 + Math.cos(ang)*len*0.5 + (Math.random()-0.5)*s*0.2,
          -s*0.25 + Math.sin(ang)*len*0.5 + (Math.random()-0.5)*s*0.2,
          side*s*0.45 + Math.cos(ang)*len,
          -s*0.25 + Math.sin(ang)*len
        );
        faceCtx.stroke();
      }
    }

    // Nose hole
    faceCtx.beginPath();
    faceCtx.ellipse(0, s*0.05, s*0.06, s*0.14, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#000';
    faceCtx.fill();

    // Mouth - massive wide grin
    const mouthY = s*0.4;
    faceCtx.beginPath();
    faceCtx.ellipse(0, mouthY, s*0.65, s*0.18, 0, 0, Math.PI);
    faceCtx.strokeStyle = '#1a1a1a';
    faceCtx.lineWidth = 4;
    faceCtx.stroke();

    // Teeth
    for (let t = -6; t <= 6; t++) {
      const tx = t * s*0.07;
      faceCtx.fillStyle = '#d0d0d0';
      const tw = s*0.04, th = s*0.07 + Math.sin(t*1.5) * s*0.02;
      faceCtx.fillRect(tx - tw/2, mouthY - th, tw, th);
      faceCtx.strokeStyle = '#333';
      faceCtx.lineWidth = 0.5;
      faceCtx.strokeRect(tx - tw/2, mouthY - th, tw, th);
    }
    // Bottom teeth
    for (let t = -5; t <= 5; t++) {
      const tx = t * s*0.07;
      faceCtx.fillStyle = '#c8c8c8';
      const tw = s*0.035, th = s*0.05;
      faceCtx.fillRect(tx - tw/2, mouthY + 2, tw, th);
      faceCtx.strokeStyle = '#333';
      faceCtx.lineWidth = 0.5;
      faceCtx.strokeRect(tx - tw/2, mouthY + 2, tw, th);
    }

    // Distortion glitch slices
    for (let d = 0; d < 30; d++) {
      const dx = (Math.random()-0.5)*s*2.6;
      const dy = (Math.random()-0.5)*s*3;
      const dw = Math.random()*s*0.4 + s*0.05;
      const dh = Math.random()*6 + 2;
      faceCtx.fillStyle = `rgba(0,0,0,${Math.random()*0.7})`;
      faceCtx.fillRect(dx, dy, dw, dh);
    }

    // Blood drip
    if (intensity > 1) {
      for (let d = 0; d < 12; d++) {
        const bx = (Math.random()-0.5)*s*2;
        const by = s*0.3 + Math.random()*s*0.8;
        faceCtx.fillStyle = `rgba(80,0,0,${0.3+Math.random()*0.4})`;
        faceCtx.beginPath();
        faceCtx.ellipse(bx, by, 2+Math.random()*4, 3+Math.random()*12, 0, 0, Math.PI*2);
        faceCtx.fill();
      }
    }

    faceCtx.restore();
  }

  /* --- DRAW FIGURE --- */
  function drawFigure(w, h) {
    faceCtx.clearRect(0, 0, w, h);
    faceCtx.fillStyle = '#000';
    faceCtx.fillRect(0, 0, w, h);

    const cx = w/2, cy = h/2 + h*0.1;
    const s = Math.min(w, h) * 0.35;

    // Tall thin figure
    faceCtx.fillStyle = '#08080a';
    faceCtx.beginPath();
    faceCtx.moveTo(cx - s*0.35, cy + s*0.9);
    faceCtx.lineTo(cx - s*0.55, cy - s*0.3);
    faceCtx.quadraticCurveTo(cx, cy - s*1.5, cx + s*0.55, cy - s*0.3);
    faceCtx.lineTo(cx + s*0.35, cy + s*0.9);
    faceCtx.closePath();
    faceCtx.fill();

    // Head
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy - s*0.8, s*0.28, s*0.35, 0, 0, Math.PI*2);
    faceCtx.fill();

    // Hollow eyes
    faceCtx.fillStyle = '#000';
    faceCtx.beginPath();
    faceCtx.ellipse(cx - s*0.12, cy - s*0.85, s*0.06, s*0.09, 0, 0, Math.PI*2);
    faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.ellipse(cx + s*0.12, cy - s*0.85, s*0.06, s*0.09, 0, 0, Math.PI*2);
    faceCtx.fill();

    // Mouth (O shape)
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy - s*0.65, s*0.04, s*0.07, 0, 0, Math.PI*2);
    faceCtx.fill();

    // Arms reaching
    faceCtx.strokeStyle = '#08080a';
    faceCtx.lineWidth = s*0.15;
    faceCtx.lineCap = 'round';
    faceCtx.beginPath();
    faceCtx.moveTo(cx - s*0.5, cy - s*0.2);
    faceCtx.quadraticCurveTo(cx - s*1.1, cy + s*0.5, cx - s*0.9, cy + s*0.3);
    faceCtx.stroke();
    faceCtx.beginPath();
    faceCtx.moveTo(cx + s*0.5, cy - s*0.2);
    faceCtx.quadraticCurveTo(cx + s*1.1, cy + s*0.5, cx + s*0.9, cy + s*0.3);
    faceCtx.stroke();

    // Glitch overlay
    for (let d = 0; d < 25; d++) {
      faceCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.04})`;
      faceCtx.fillRect(Math.random()*w, Math.random()*h, Math.random()*200+30, Math.random()*3+1);
    }
  }

  /* --- DRAW BLOOD STREAKS --- */
  let bloodDrips = [];

  function addBlood() {
    const w = bloodCanvas.width, h = bloodCanvas.height;
    bloodCtx.clearRect(0, 0, w, h);
    for (let i = 0; i < 20 + scares * 3; i++) {
      const x = Math.random() * w;
      const y = Math.random() * h;
      const len = 20 + Math.random() * 80;
      const thick = 2 + Math.random() * 6;
      bloodCtx.strokeStyle = `rgba(80,0,0,${0.2+Math.random()*0.3})`;
      bloodCtx.lineWidth = thick;
      bloodCtx.lineCap = 'round';
      bloodCtx.beginPath();
      bloodCtx.moveTo(x, y);
      bloodCtx.quadraticCurveTo(x + (Math.random()-0.5)*20, y + len*0.5, x + (Math.random()-0.5)*15, y + len);
      bloodCtx.stroke();
      // Drip blob at end
      bloodCtx.beginPath();
      bloodCtx.arc(x + (Math.random()-0.5)*15, y + len, thick*0.8, 0, Math.PI*2);
      bloodCtx.fill();
    }
  }

  /* ========== JUMPSCARES ========== */
  function trigger(type) {
    if (scareCD > Date.now()) return;
    scareCD = Date.now() + 3000;
    scares++; fearLevel = Math.min(fearLevel + 1, 30);

    const w = faceCanvas.width, h = faceCanvas.height;
    flashNow(Math.random() > 0.3 ? '#fff' : '#800');

    if (!type || type === 'face') drawFace(w, h, fearLevel);
    else if (type === 'figure') drawFigure(w, h);
    else if (type === 'staticjump') {
      faceCtx.clearRect(0, 0, w, h);
      for (let i = 0; i < 500; i++) {
        faceCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.3})`;
        faceCtx.fillRect(Math.random()*w, Math.random()*h, Math.random()*50+5, Math.random()*3+1);
      }
    }
    faceCanvas.classList.add('active');
    screenShake(6 + fearLevel);
    playScareSound(type);

    if (Math.random() > 0.4) {
      document.getElementById('blood-overlay').classList.add('active');
      addBlood();
      setTimeout(() => document.getElementById('blood-overlay').classList.remove('active'), 3000);
    }

    if (scares > 3 && Math.random() > 0.5) {
      showStatic(800);
    }

    setTimeout(() => faceCanvas.classList.remove('active'), 150 + Math.random()*100);
  }

  function showStatic(dur) {
    const el = document.getElementById('static-overlay');
    el.style.background = `url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(#n)" opacity="0.8"/></svg>')`;
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), dur || 500);
  }

  let currentFlash = null;

  function flashNow(color) {
    const el = document.getElementById('flash-overlay');
    el.style.background = color || '#fff';
    el.classList.add('active');
    if (currentFlash) clearTimeout(currentFlash);
    currentFlash = setTimeout(() => {
      el.classList.remove('active');
      currentFlash = null;
    }, 50 + Math.random()*80);
  }

  /* ========== SCREEN SHAKE ========== */
  const shakeEl = document.getElementById('shake-layer');

  function screenShake(intensity) {
    let count = 0;
    const max = Math.min(intensity * 2, 30);
    const interval = setInterval(() => {
      const x = (Math.random()-0.5)*intensity*3;
      const y = (Math.random()-0.5)*intensity*3;
      shakeEl.style.transform = `translate(${x}px,${y}px)`;
      if (count++ > max) {
        clearInterval(interval);
        shakeEl.style.transform = 'translate(0,0)';
        if (Math.random() > 0.7 && intensity > 8) {
          // Residual shake
          setTimeout(() => screenShake(intensity*0.3), 200);
        }
      }
    }, 25);
  }

  /* ========== AUDIO ========== */
  function initAudio() {
    if (AC) return;
    AC = new (window.AudioContext || window.webkitAudioContext)();

    // Dual infrasound
    [19, 33, 47].forEach((freq, i) => {
      const o = AC.createOscillator();
      o.type = i === 1 ? 'triangle' : 'sine';
      o.frequency.value = freq;
      const g = AC.createGain();
      g.gain.setValueAtTime(0, AC.currentTime);
      g.gain.linearRampToValueAtTime(0.12 - i*0.03, AC.currentTime + 6);
      const f = AC.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 90 + i*20;
      o.connect(f); f.connect(g); g.connect(AC.destination);
      o.start();
    });

    // Noise floor
    const nb = AC.createBuffer(1, AC.sampleRate*4, AC.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random()*2-1)*0.015;
    const ns = AC.createBufferSource();
    ns.buffer = nb; ns.loop = true;
    const ng = AC.createGain();
    ng.gain.setValueAtTime(0, AC.currentTime);
    ng.gain.linearRampToValueAtTime(0.06, AC.currentTime + 8);
    const nf = AC.createBiquadFilter();
    nf.type = 'lowpass'; nf.frequency.value = 600;
    ns.connect(nf); nf.connect(ng); ng.connect(AC.destination);
    ns.start();

    // Corrupted lullaby loop
    scheduleLullaby();

    // Random stings
    scheduleSting();

    audioReady = true;
  }

  function scheduleLullaby() {
    if (!AC) return;
    setTimeout(() => {
      if (!AC) return;
      try {
        const notes = [262, 294, 330, 349, 392, 349, 330, 294];
        const corrupted = notes.map(n => n + (Math.random()-0.5)*80);
        corrupted.forEach((freq, i) => {
          const o = AC.createOscillator();
          o.type = i % 2 === 0 ? 'sine' : 'square';
          o.frequency.value = freq;
          const g = AC.createGain();
          g.gain.setValueAtTime(0, AC.currentTime + i*0.4);
          g.gain.linearRampToValueAtTime(0.04, AC.currentTime + i*0.4 + 0.05);
          g.gain.linearRampToValueAtTime(0, AC.currentTime + i*0.4 + 0.35);
          o.connect(g); g.connect(AC.destination);
          o.start(AC.currentTime + i*0.4);
          o.stop(AC.currentTime + i*0.4 + 0.4);
        });
      } catch(e) {}
      if (fearLevel < 15) scheduleLullaby();
    }, 8000 + Math.random()*12000);
  }

  function scheduleSting() {
    if (!AC) return;
    setTimeout(() => {
      if (!AC) return;
      try {
        const dur = 0.08 + Math.random()*0.15;
        const b = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
        const d = b.getChannelData(0);
        const freq = 100 + Math.random()*2000;
        for (let i = 0; i < d.length; i++) {
          const t = i/AC.sampleRate;
          d[i] = Math.sin(2*Math.PI*freq*t)*Math.exp(-t*20)*0.3;
          d[i] += (Math.random()*2-1)*0.2*Math.exp(-t*10);
          d[i] = Math.tanh(d[i]*4)/4;
        }
        const s = AC.createBufferSource();
        s.buffer = b;
        const g = AC.createGain();
        g.gain.value = 0.2 + Math.random()*0.3;
        const dist = AC.createWaveShaper();
        const curve = new Float32Array(256);
        for (let i = 0; i < 256; i++) curve[i] = ((Math.PI+200)*((i*2)/256-1))/(Math.PI+200*Math.abs((i*2)/256-1));
        dist.curve = curve;
        s.connect(dist); dist.connect(g); g.connect(AC.destination);
        s.start();
      } catch(e) {}
      scheduleSting();
    }, 4000 + Math.random()*12000);
  }

  function playScareSound(type) {
    if (!AC) return;
    try {
      const voices = [
        { f: 50, d: 0.6, v: 0.9 },
        { f: 120, d: 0.4, v: 1.0 },
        { f: 800, d: 0.2, v: 0.7 },
        { f: 40, d: 0.8, v: 0.8 },
        { f: 3000, d: 0.15, v: 0.5 },
      ];
      const v = voices[Math.floor(Math.random()*voices.length)];
      const dur = v.d;
      const b = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        const t = i/AC.sampleRate;
        d[i] = Math.sin(2*Math.PI*v.f*t)*Math.exp(-t*8)*v.v;
        d[i] += (Math.random()*2-1)*v.v*0.5*Math.exp(-t*4);
        d[i] += Math.sin(2*Math.PI*v.f*1.5*t)*Math.exp(-t*10)*v.v*0.3;
        d[i] = Math.tanh(d[i]*5)/5;
      }
      const s = AC.createBufferSource();
      s.buffer = b;
      const g = AC.createGain();
      g.gain.value = 0.9;
      const dist = AC.createWaveShaper();
      const curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) curve[i] = ((Math.PI+400)*((i*2)/256-1))/(Math.PI+400*Math.abs((i*2)/256-1));
      dist.curve = curve;
      s.connect(dist); dist.connect(g); g.connect(AC.destination);
      s.start();
    } catch(e) {}
  }

    { from: /silent/gi, to: ['dead', 'empty', 'waiting'] },
    { from: /empty/gi, to: ['full of teeth', 'watching', 'hungry'] },
    { from: /reflection/gi, to: ['it', 'the other one', 'my skin', 'the hunger'] },
    { from: /face/gi, to: ['my face', 'its face', 'the hole'] },
    { from: /eyes?/gi, to: ['holes', 'mouths', 'teeth'] },
    { from: /smiling/gi, to: ['feeding', 'eating', 'stretching'] },
    { from: /cold/gi, to: ['inside me', 'alive', 'moving'] },
    { from: /hands?/gi, to: ['claws', 'roots', 'teeth'] },
    { from: /door/gi, to: ['mouth', 'throat', 'hole'] },
  ];

  const storyOverlay = document.getElementById('story-overlay');
  const storyText = document.getElementById('story-text');
  const storyProgress = document.getElementById('story-progress');
  const storySkip = document.getElementById('story-skip');

  let storyActive = false;
  let storyIndex = 0;
  let storyTimer = null;
  let storyCorruption = 0;
  let storyWords = [];

  function startStory() {
    if (storyActive) return;
    storyActive = true;
    storyIndex = 0;
    storyCorruption = 0;
    storyOverlay.classList.add('active');
    initAudio();
    showStoryParagraph(0);
  }

  function showStoryParagraph(idx) {
    if (idx >= STORY.length) {
      endStory();
      return;
    }
    storyIndex = idx;
    const pct = ((idx + 1) / STORY.length) * 100;
    storyProgress.style.width = pct + '%';

    // Get base text and corrupt it based on progression
    let text = STORY[idx];
    const corruptionLevel = Math.floor(idx / 2); // increases every 2 paragraphs

    // Apply word replacements based on corruption level
    for (let r = 0; r < Math.min(corruptionLevel + 1, REPLACEMENTS.length); r++) {
      const rule = REPLACEMENTS[r];
      if (Math.random() < 0.7) {
        const replacement = rule.to[Math.floor(Math.random() * rule.to.length)];
        text = text.replace(rule.from, () => replacement);
      }
    }

    // Apply letter corruption at high levels
    if (corruptionLevel > 3) {
      text = text.split('').map((ch, i) => {
        if (ch.match(/[a-zA-Z]/) && Math.random() < 0.03 * (corruptionLevel - 3)) {
          const corrupt = String.fromCharCode(ch.charCodeAt(0) + (Math.random() > 0.5 ? 1 : -1));
          return /[a-zA-Z]/.test(corrupt) ? corrupt : ch;
        }
        return ch;
      }).join('');
    }

    // Add glitch spans to some words
    const words = text.split(' ');
    const htmlWords = words.map((w, i) => {
      if (corruptionLevel > 1 && Math.random() < 0.04 * corruptionLevel) {
        return `<span class="glitched">${w}</span>`;
      }
      if (Math.random() < 0.08 * (corruptionLevel + 1)) {
        return `<span class="corrupted">${w}</span>`;
      }
      return w;
    });
    storyText.innerHTML = htmlWords.join(' ');

    // Screen effects based on progression
    if (corruptionLevel > 4) screenShake(3);
    if (corruptionLevel > 6) flashNow('#000');

    // Auto-advance
    const delay = Math.max(3500, 10000 - corruptionLevel * 400);
    if (storyTimer) clearTimeout(storyTimer);
    storyTimer = setTimeout(() => showStoryParagraph(idx + 1), delay);

    // Audio whispers during story
    if (Math.random() > 0.5) whisper('keep reading');
    if (corruptionLevel > 5) playScareSound();
  }

  function endStory() {
    if (storyTimer) clearTimeout(storyTimer);
    // Final horror
    storyText.style.color = '#4a2020';
    storyText.innerHTML = 'It\'s right behind you.';
    storyProgress.style.width = '100%';
    storyProgress.style.background = 'rgba(120,0,0,0.5)';

    setTimeout(() => {
      storyOverlay.classList.remove('active');
      storyActive = false;
      // The monster comes
      drawFigure(faceCanvas.width, faceCanvas.height);
      faceCanvas.classList.add('active');
      screenShake(25);
      flashNow('#fff');
      playScareSound();
      playScareSound('noise');
      whisper('i never left');
      addBlood();
      document.getElementById('blood-overlay').classList.add('active');

      // Figure stays for 3 full seconds
      setTimeout(() => {
        faceCanvas.classList.remove('active');
        document.getElementById('blood-overlay').classList.remove('active');
        // Then face jumpscare as a final hit
        setTimeout(() => trigger('face'), 500);
        bsod();
      }, 3000);
    }, 2000);
  }

  // Auto-start story after entering
  setTimeout(startStory, 1500);

  storySkip.addEventListener('click', () => {
    if (storyTimer) clearTimeout(storyTimer);
    if (storyActive) endStory();
  });

  // ---- INIT ----
  document.addEventListener('click', initAudio, { once: true });
  document.addEventListener('keydown', initAudio, { once: true });
  document.addEventListener('mousemove', initAudio, { once: true });

  console.log('%c⏺', 'font-size:100px;color:#0a0a0a');
  console.log('%cyou are being recorded', 'color:#2a2a2a;font-size:12px');
  console.log('%cthere is no escape', 'color:#1a1a1a;font-size:10px');

})();
</script>
</body>
