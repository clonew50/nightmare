<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>you shouldn't be here</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; }
body {
  background: #050508; color: #c0c0c0;
  font-family: 'Times New Roman', serif;
  user-select: none; -webkit-user-select: none;
  position: fixed; inset: 0;
}
canvas { display: block; }
.hidden { display: none !important; }

#three-container { position: fixed; inset: 0; z-index: 0; }
#glitch-overlay { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
#face-overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.02s; }
#face-overlay.active { opacity: 1; }
#blood-overlay { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
#blood-overlay.active { opacity: 1; }
#scanlines {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0,0,0,0.2) 1px, rgba(0,0,0,0.2) 3px);
}
#vignette {
  position: fixed; inset: 0; z-index: 5; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 100%);
  transition: background 1s;
}

#ui-layer { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
#ui-layer.clickable { pointer-events: auto; }
#shake-layer { position: fixed; inset: 0; z-index: 90; pointer-events: none; }
#bsod-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: #012; color: #aab; font-family: 'Consolas',monospace; padding: 10vw;
  text-align: center;
}
#bsod-overlay.active { display: flex; pointer-events: auto; }
#flash-overlay { position: fixed; inset: 0; z-index: 98; pointer-events: none; opacity: 0; transition: opacity 0.02s; }
#flash-overlay.active { opacity: 1; }

.fake-popup {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  background: #0a0a0f; border: 1px solid #2a2a3a;
  padding: clamp(16px,4vw,30px);
  max-width: min(400px, 85vw);
  width: 85vw;
  box-shadow: 0 0 100px rgba(80,0,0,0.3);
  font-size: clamp(13px,1.8vw,15px);
  line-height: 1.7; color: #909098;
  font-family: 'Times New Roman', serif;
  z-index: 21;
}
.fake-popup.danger { border-color: #4a1010; box-shadow: 0 0 100px rgba(120,0,0,0.4); }
.fake-popup.danger h3 { color: #7a2020; }
.fake-popup h3 { font-weight: normal; margin-bottom: 12px; font-size: clamp(14px,2vw,17px); letter-spacing: 0.1em; color: #7a7a7a; }
.fake-popup .btn-row { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; flex-wrap: wrap; }
.fake-popup button {
  background: #16161e; border: 1px solid #3a3a4a; color: #a0a0a0;
  padding: clamp(8px,2vw,12px) clamp(14px,3vw,20px);
  font-family: inherit; font-size: clamp(13px,1.8vw,14px);
  cursor: pointer; transition: 0.1s; min-height: 44px; min-width: 60px;
  -webkit-tap-highlight-color: transparent;
}
.fake-popup button:active { background: #262632; border-color: #5a5a6a; }
#corner-counter {
  position: fixed; bottom: 8px; left: 8px;
  color: rgba(40,40,40,0.06);
  font-family: monospace; font-size: 9px; z-index: 5; pointer-events: none;
}

@media (max-width: 600px) {
  .fake-popup { width: 92vw; padding: 18px; }
}
</style>
</head>
<body>

<div id="three-container"></div>
<canvas id="glitch-overlay"></canvas>
<canvas id="face-overlay"></canvas>
<canvas id="blood-overlay"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="ui-layer"></div>
<div id="shake-layer"></div>
<div id="bsod-overlay"><div id="bsod-text"></div></div>
<div id="flash-overlay"></div>
<div id="corner-counter">0</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  let AC = null, audioReady = false;
  let clicks = 0, scares = 0;
  let idleSec = 0, idleTimer = null, lastAction = Date.now();
  let scareCD = 0, fearLevel = 0;
  let bsodActive = false;
  let isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

  const NIGHTMARES = [
    "you forgot something important", "someone is behind you", "this room has no doors",
    "you've been here before", "they know you're awake", "the reflection didn't move",
    "your name was never yours", "it's been watching since you arrived",
    "the exit was never real", "you are being recorded", "it's smiling at you",
    "don't blink", "it's closer now", "there's something in the corner",
    "it's wearing someone else's face", "you let it in"
  ];

  /* ========== CANVAS ========== */
  const faceCanvas = document.getElementById('face-overlay');
  const faceCtx = faceCanvas.getContext('2d');
  const bloodCanvas = document.getElementById('blood-overlay');
  const bloodCtx = bloodCanvas.getContext('2d');

  function resizeAll() {
    faceCanvas.width = bloodCanvas.width = window.innerWidth;
    faceCanvas.height = bloodCanvas.height = window.innerHeight;
  }
  resizeAll();
  window.addEventListener('resize', resizeAll);

  function drawFace(w, h, intensity) {
    faceCtx.globalCompositeOperation = 'copy';
    faceCtx.fillStyle = '#000';
    faceCtx.fillRect(0, 0, w, h);
    faceCtx.globalCompositeOperation = 'source-over';
    const cx = w/2, cy = h/2;
    const s = Math.min(w, h) * 0.42;
    faceCtx.save();
    faceCtx.translate(cx, cy);
    faceCtx.beginPath();
    faceCtx.ellipse(0, 0, s*1.2, s*1.5, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#14141e';
    faceCtx.fill();
    for (let side = -1; side <= 1; side += 2) {
      faceCtx.beginPath();
      faceCtx.ellipse(side*s*0.45, -s*0.25, s*0.28, s*0.35, 0, 0, Math.PI*2);
      faceCtx.fillStyle = '#050505'; faceCtx.fill();
      faceCtx.beginPath();
      faceCtx.arc(side*s*0.45+side*s*0.06, -s*0.22+s*0.03, s*0.1, 0, Math.PI*2);
      faceCtx.fillStyle = `rgba(180,180,180,${0.6+Math.random()*0.4})`;
      faceCtx.fill();
      faceCtx.strokeStyle = '#3a0a0a'; faceCtx.lineWidth = 1.5;
      for (let v = 0; v < 10; v++) {
        const ang = Math.random()*Math.PI*2, len = s*(0.2+Math.random()*0.3);
        faceCtx.beginPath();
        faceCtx.moveTo(side*s*0.45, -s*0.25);
        faceCtx.quadraticCurveTo(side*s*0.45+Math.cos(ang)*len*0.5+(Math.random()-0.5)*s*0.2, -s*0.25+Math.sin(ang)*len*0.5+(Math.random()-0.5)*s*0.2, side*s*0.45+Math.cos(ang)*len, -s*0.25+Math.sin(ang)*len);
        faceCtx.stroke();
      }
    }
    faceCtx.beginPath();
    faceCtx.ellipse(0, s*0.05, s*0.06, s*0.14, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#000'; faceCtx.fill();
    const mY = s*0.4;
    faceCtx.beginPath();
    faceCtx.ellipse(0, mY, s*0.7, s*0.2, 0, 0, Math.PI);
    faceCtx.strokeStyle = '#1a1a1a'; faceCtx.lineWidth = 4; faceCtx.stroke();
    for (let t = -7; t <= 7; t++) {
      const tx = t*s*0.065;
      faceCtx.fillStyle = '#d0d0d0';
      faceCtx.fillRect(tx-s*0.02, mY-s*0.07-Math.abs(Math.sin(t))*s*0.01, s*0.04, s*0.07+Math.sin(t*1.5)*s*0.02);
      faceCtx.strokeStyle = '#333'; faceCtx.lineWidth = 0.5;
      faceCtx.strokeRect(tx-s*0.02, mY-s*0.07-Math.abs(Math.sin(t))*s*0.01, s*0.04, s*0.07+Math.sin(t*1.5)*s*0.02);
    }
    for (let t = -6; t <= 6; t++) {
      const tx = t*s*0.065;
      faceCtx.fillStyle = '#c8c8c8';
      faceCtx.fillRect(tx-s*0.017, mY+2, s*0.035, s*0.05);
      faceCtx.strokeStyle = '#333'; faceCtx.lineWidth = 0.5;
      faceCtx.strokeRect(tx-s*0.017, mY+2, s*0.035, s*0.05);
    }
    for (let d = 0; d < 35; d++) {
      const dx = (Math.random()-0.5)*s*2.8, dy = (Math.random()-0.5)*s*3;
      faceCtx.fillStyle = `rgba(0,0,0,${Math.random()*0.7})`;
      faceCtx.fillRect(dx, dy, Math.random()*s*0.4+s*0.05, Math.random()*6+2);
    }
    if (intensity > 1) {
      for (let d = 0; d < 15; d++) {
        faceCtx.fillStyle = `rgba(80,0,0,${0.2+Math.random()*0.5})`;
        faceCtx.beginPath();
        faceCtx.ellipse((Math.random()-0.5)*s*2, s*0.3+Math.random()*s*0.8, 2+Math.random()*4, 3+Math.random()*14, 0, 0, Math.PI*2);
        faceCtx.fill();
      }
    }
    faceCtx.restore();
  }

  function drawFigure(w, h) {
    faceCtx.clearRect(0, 0, w, h);
    faceCtx.fillStyle = '#000'; faceCtx.fillRect(0, 0, w, h);
    if (isMobile) { w = Math.min(w, 500); h = Math.min(h, 800); } // cap for perf
    const cx = w/2, cy = h/2 + h*0.1;
    const s = Math.min(w, h) * 0.35;
    faceCtx.fillStyle = '#08080a';
    faceCtx.beginPath();
    faceCtx.moveTo(cx-s*0.35, cy+s*0.9);
    faceCtx.lineTo(cx-s*0.55, cy-s*0.3);
    faceCtx.quadraticCurveTo(cx, cy-s*1.5, cx+s*0.55, cy-s*0.3);
    faceCtx.lineTo(cx+s*0.35, cy+s*0.9);
    faceCtx.closePath(); faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy-s*0.8, s*0.28, s*0.35, 0, 0, Math.PI*2);
    faceCtx.fill();
    faceCtx.fillStyle = '#000';
    faceCtx.beginPath();
    faceCtx.ellipse(cx-s*0.12, cy-s*0.85, s*0.07, s*0.1, 0, 0, Math.PI*2);
    faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.ellipse(cx+s*0.12, cy-s*0.85, s*0.07, s*0.1, 0, 0, Math.PI*2);
    faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy-s*0.65, s*0.05, s*0.08, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#000'; faceCtx.fill();
    faceCtx.strokeStyle = '#08080a'; faceCtx.lineWidth = s*0.15; faceCtx.lineCap = 'round';
    faceCtx.beginPath();
    faceCtx.moveTo(cx-s*0.5, cy-s*0.2);
    faceCtx.quadraticCurveTo(cx-s*1.1, cy+s*0.5, cx-s*0.9, cy+s*0.3);
    faceCtx.stroke();
    faceCtx.beginPath();
    faceCtx.moveTo(cx+s*0.5, cy-s*0.2);
    faceCtx.quadraticCurveTo(cx+s*1.1, cy+s*0.5, cx+s*0.9, cy+s*0.3);
    faceCtx.stroke();
    for (let d = 0; d < 30; d++) {
      faceCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.04})`;
      faceCtx.fillRect(Math.random()*w, Math.random()*h, Math.random()*200+30, Math.random()*3+1);
    }
  }

  function drawEye(w, h) {
    faceCtx.clearRect(0, 0, w, h);
    faceCtx.fillStyle = '#000'; faceCtx.fillRect(0, 0, w, h);
    const cx = w/2, cy = h/2, s = Math.min(w, h)*0.4;
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy, s*0.8, s*0.6, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#0a0a0a'; faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.ellipse(cx, cy, s*0.6, s*0.45, 0, 0, Math.PI*2);
    faceCtx.fillStyle = '#e0d8d0'; faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.arc(cx, cy, s*0.3, 0, Math.PI*2);
    faceCtx.fillStyle = '#3a3028'; faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.arc(cx, cy, s*0.15, 0, Math.PI*2);
    faceCtx.fillStyle = '#000'; faceCtx.fill();
    faceCtx.strokeStyle = '#4a1010'; faceCtx.lineWidth = 1.5;
    for (let v = 0; v < 15; v++) {
      const ang = Math.random()*Math.PI*2, len = s*(0.3+Math.random()*0.3);
      faceCtx.beginPath();
      faceCtx.moveTo(cx, cy);
      faceCtx.quadraticCurveTo(cx+Math.cos(ang)*len*0.5+(Math.random()-0.5)*s*0.2, cy+Math.sin(ang)*len*0.5+(Math.random()-0.5)*s*0.2, cx+Math.cos(ang)*len, cy+Math.sin(ang)*len);
      faceCtx.stroke();
    }
  }

  function addBlood() {
    if (!bloodCanvas || !bloodCtx) return;
    const w = bloodCanvas.width, h = bloodCanvas.height;
    bloodCtx.clearRect(0, 0, w, h);
    for (let i = 0; i < 25+scares*3; i++) {
      const x = Math.random()*w, y = Math.random()*h;
      bloodCtx.strokeStyle = `rgba(80,0,0,${0.2+Math.random()*0.3})`;
      bloodCtx.lineWidth = 2+Math.random()*6; bloodCtx.lineCap = 'round';
      bloodCtx.beginPath();
      bloodCtx.moveTo(x, y);
      bloodCtx.quadraticCurveTo(x+(Math.random()-0.5)*20, y+20+Math.random()*60, x+(Math.random()-0.5)*15, y+30+Math.random()*80);
      bloodCtx.stroke();
      bloodCtx.beginPath();
      bloodCtx.arc(x+(Math.random()-0.5)*15, y+30+Math.random()*80, 2+Math.random()*4, 0, Math.PI*2);
      bloodCtx.fill();
    }
  }

  /* ========== MOBILE FEATURES ========== */
  // Vibration on scares
  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 200); } catch(e) {}
  }

  // Back button trap
  let backTraps = 0;
  window.addEventListener('popstate', (e) => {
    backTraps++;
    history.pushState(null, '', location.href);
    if (backTraps === 1) {
      popup({t:'trying to leave?', b:'there is no way back.\nthe door is gone.', btn:'...', danger:true});
    } else if (backTraps === 2) {
      trigger('face');
      popup({t:'stop', b:'you cannot go back.\nit will not let you.', btn:'i understand', danger:true});
    } else {
      trigger('figure');
      bsod();
    }
  });
  history.pushState(null, '', location.href);

  // Battery API fake
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      let warned = false;
      b.addEventListener('levelchange', () => {
        if (b.level < 0.3 && !warned) {
          warned = true;
          setTimeout(() => popup({t:'BATTERY DRAINING', b:'your battery is dropping fast.\nbut that\'s not what\'s powering this page.', btn:'...', danger:true}), 20000);
        }
      });
    }).catch(()=>{});
  }

  // Ambient light (if available, adjust horror)
  if ('AmbientLightSensor' in window) {
    try {
      const sensor = new AmbientLightSensor();
      sensor.addEventListener('reading', () => {
        if (sensor.illuminance < 10 && fearLevel < 5) {
          // Dark room = more aggressive
          fearLevel = Math.max(fearLevel, 3);
        }
      });
      sensor.start();
    } catch(e) {}
  }

  // Screen wake lock attempt
  try {
    if (navigator.wakeLock) {
      navigator.wakeLock.request('screen').catch(()=>{});
    }
  } catch(e) {}

  // Orientation lock hint
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(()=>{});
    }
  } catch(e) {}

  // Gyroscope - device orientation horror
  let prevGamma = 0, prevBeta = 0;
  if (window.DeviceOrientationEvent) {
    // iOS 13+ requires permission request
    const startOrientation = () => {
      window.addEventListener('deviceorientation', (e) => {
        const g = e.gamma || 0, b = e.beta || 0;
        if (Math.abs(g - prevGamma) > 30 || Math.abs(b - prevBeta) > 30) {
          // Sudden phone movement = scare opportunity
          if (Math.random() > 0.7 && scares > 2) {
            flashNow('#fff');
            playScareSound();
            screenShake(4);
          }
        }
        prevGamma = g; prevBeta = b;
      });
    };
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') startOrientation();
      }).catch(() => {});
    } else {
      startOrientation();
    }
  }

  /* ========== JUMPSCARES ========== */
  function trigger(type) {
    if (scareCD > Date.now()) return;
    scareCD = Date.now() + (isMobile ? 2500 : 2000);
    scares++; fearLevel = Math.min(fearLevel+1, 35);
    const w = faceCanvas.width, h = faceCanvas.height;
    flashNow(Math.random()>0.3?'#fff':'#800', 0.6);
    if (!type || type === 'face') drawFace(w, h, fearLevel);
    else if (type === 'figure') drawFigure(w, h);
    else if (type === 'eye') drawEye(w, h);
    else if (type === 'staticjump') {
      faceCtx.clearRect(0, 0, w, h);
      for (let i = 0; i < 600; i++) {
        faceCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.3})`;
        faceCtx.fillRect(Math.random()*w, Math.random()*h, Math.random()*50+5, Math.random()*3+1);
      }
    }
    faceCanvas.classList.add('active');
    screenShake(6 + fearLevel);
    playScareSound();
    vibrate(isMobile ? 300 : 0);

    if (Math.random() > 0.4) {
      document.getElementById('blood-overlay').classList.add('active');
      addBlood();
      setTimeout(() => document.getElementById('blood-overlay').classList.remove('active'), 3000+(isMobile?1000:0));
    }
    if (scares > 2 && Math.random() > 0.5) {
      const el = document.getElementById('static-overlay') || (()=>{
        const d = document.createElement('div'); d.id = 'static-overlay';
        d.style.cssText = 'position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 0.1s';
        document.body.appendChild(d); return d;
      })();
      el.style.background = `url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(#n)" opacity="0.8"/></svg>')`;
      el.style.opacity = '0.8';
      setTimeout(() => el.style.opacity = '0', 400+(isMobile?200:0));
    }
    setTimeout(() => faceCanvas.classList.remove('active'), 120+Math.random()*80);
  }

  function randomJumpScare() {
    const r = Math.random();
    if (r < 0.35) trigger('face');
    else if (r < 0.6) trigger('figure');
    else if (r < 0.8) trigger('eye');
    else trigger('staticjump');
  }

  let currentFlash = null;
  const SUBLIMINALS = ['RUN','GO NOW','BEHIND YOU','DON\'T BLINK','IT SEES YOU','TOO LATE','GET OUT','IT\'S HERE'];
  function flashNow(color, intensity) {
    const el = document.getElementById('flash-overlay');
    el.style.background = color || '#fff';
    el.style.opacity = intensity || '0.5';
    if (Math.random()>0.7 && fearLevel>3) {
      el.textContent = SUBLIMINALS[Math.floor(Math.random()*SUBLIMINALS.length)];
      el.style.cssText += `display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:clamp(40px,10vw,80px);color:#000;letter-spacing:0.3em;z-index:98;`;
    } else {
      el.textContent = '';
    }
    el.classList.add('active');
    if (currentFlash) clearTimeout(currentFlash);
    currentFlash = setTimeout(() => {
      el.style.opacity = '0';
      setTimeout(() => { el.classList.remove('active'); el.textContent = ''; currentFlash = null; }, 50);
    }, 50+Math.random()*80);
  }

  const shakeEl = document.getElementById('shake-layer');
  let shakeActive = false;
  function screenShake(intensity) {
    if (shakeActive) return;
    shakeActive = true;
    let count = 0;
    const max = Math.min(intensity*2, 30);
    const interval = setInterval(() => {
      shakeEl.style.transform = `translate(${(Math.random()-0.5)*intensity*3}px,${(Math.random()-0.5)*intensity*3}px)`;
      if (count++ > max) {
        clearInterval(interval);
        shakeEl.style.transform = 'translate(0,0)';
        shakeActive = false;
        if (Math.random() > 0.7 && intensity > 8) setTimeout(() => screenShake(intensity*0.3), 200);
      }
    }, 25);
  }

  /* ========== AUDIO ========== */
  function initAudio() {
    if (AC) return;
    AC = new (window.AudioContext || window.webkitAudioContext)();
    // Resume suspended context on mobile
    if (AC.state === 'suspended') AC.resume().catch(() => {});

    [19, 33, 47].forEach((freq, i) => {
      const o = AC.createOscillator();
      o.type = i === 1 ? 'triangle' : 'sine';
      o.frequency.value = freq;
      const g = AC.createGain();
      g.gain.setValueAtTime(0, AC.currentTime);
      g.gain.linearRampToValueAtTime(0.12 - i*0.03, AC.currentTime + 6);
      const f = AC.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 90 + i*20;
      o.connect(f); f.connect(g); g.connect(AC.destination);
      o.start();
    });

    const nb = AC.createBuffer(1, AC.sampleRate*4, AC.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random()*2-1)*0.015;
    const ns = AC.createBufferSource();
    ns.buffer = nb; ns.loop = true;
    const ng = AC.createGain();
    ng.gain.setValueAtTime(0, AC.currentTime);
    ng.gain.linearRampToValueAtTime(0.06, AC.currentTime + 8);
    const nf = AC.createBiquadFilter();
    nf.type = 'lowpass'; nf.frequency.value = 600;
    ns.connect(nf); nf.connect(ng); ng.connect(AC.destination);

  function scheduleLullaby() {
    if (!AC) return;
    setTimeout(() => {
      if (!AC) return;
      try {
        const notes = [262, 294, 330, 349, 392, 349, 330, 294];
        const corrupted = notes.map(n => n + (Math.random()-0.5)*100);
        corrupted.forEach((freq, i) => {
          const o = AC.createOscillator();
          o.type = i % 2 === 0 ? 'sine' : 'square';
          o.frequency.value = freq;
          const g = AC.createGain();
          g.gain.setValueAtTime(0, AC.currentTime + i*0.4);
          g.gain.linearRampToValueAtTime(0.04, AC.currentTime + i*0.4 + 0.05);
          g.gain.linearRampToValueAtTime(0, AC.currentTime + i*0.4 + 0.35);
          o.connect(g); g.connect(AC.destination);
          o.start(AC.currentTime + i*0.4);
          o.stop(AC.currentTime + i*0.4 + 0.4);
        });
      } catch(e) {}
      if (fearLevel < 18) scheduleLullaby();
    }, 8000 + Math.random()*12000);
  }

  function scheduleSting() {
    if (!AC) return;
    setTimeout(() => {
      if (!AC) return;
      try {
        const dur = 0.08+Math.random()*0.15;
        const b = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
        const d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) {
          const t = i/AC.sampleRate;
          d[i] = Math.sin(2*Math.PI*(100+Math.random()*2000)*t)*Math.exp(-t*20)*0.3;
          d[i] += (Math.random()*2-1)*0.2*Math.exp(-t*10);
          d[i] = Math.tanh(d[i]*4)/4;
        }
        const s = AC.createBufferSource();
        s.buffer = b;
        const g = AC.createGain();
        g.gain.value = 0.2+Math.random()*0.3;
        const dist = AC.createWaveShaper();
        const curve = new Float32Array(256);
        for (let i = 0; i < 256; i++) curve[i] = ((Math.PI+200)*((i*2)/256-1))/(Math.PI+200*Math.abs((i*2)/256-1));
        dist.curve = curve;
        s.connect(dist); dist.connect(g); g.connect(AC.destination);
        s.start();
      } catch(e) {}
      scheduleSting();
    }, 3000+Math.random()*8000);
  }

        {f:40,d:0.8,v:0.8},{f:3000,d:0.15,v:0.5},{f:200,d:0.5,v:0.85}

      const b = AC.createBuffer(1, AC.sampleRate*v.d, AC.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        const t = i/AC.sampleRate;
        d[i] = Math.sin(2*Math.PI*v.f*t)*Math.exp(-t*8)*v.v;
        d[i] += (Math.random()*2-1)*v.v*0.5*Math.exp(-t*4);
        d[i] += Math.sin(2*Math.PI*v.f*1.5*t)*Math.exp(-t*10)*v.v*0.3;
        d[i] = Math.tanh(d[i]*5)/5;
      }
      const s = AC.createBufferSource();
      s.buffer = b;
      const g = AC.createGain();
      g.gain.value = 0.9;
      const dist = AC.createWaveShaper();
      const curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) curve[i] = ((Math.PI+400)*((i*2)/256-1))/(Math.PI+400*Math.abs((i*2)/256-1));
      dist.curve = curve;
      s.connect(dist); dist.connect(g); g.connect(AC.destination);

  function playHallucination() {
    if (!AC || !audioReady) return;
    try {
      const types = [
        function knock() {
          const dur = 0.06;
          const b = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < d.length; i++) {
            const t = i/AC.sampleRate;
            d[i] = Math.sin(2*Math.PI*180*t)*Math.exp(-t*60)*0.4;
          }
          const s = AC.createBufferSource();
          s.buffer = b;
          const g = AC.createGain();
          g.gain.value = 0.15+Math.random()*0.1;
          const p = AC.createStereoPanner();
          p.pan.value = (Math.random()-0.5)*0.8;
          s.connect(p); p.connect(g); g.connect(AC.destination);
          s.start();
        },
        function footstep() {
          let stepCount = 0;
          function step() {
            if (stepCount++ > 20 || fearLevel < 3) return;
            const dur = 0.05+Math.random()*0.1;
            const b = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
            const d = b.getChannelData(0);
            for (let i = 0; i < d.length; i++) {
              const t = i/AC.sampleRate;
              d[i] = (Math.random()*2-1)*0.4*Math.exp(-t*50);
              d[i] += Math.sin(2*Math.PI*80*t)*Math.exp(-t*30)*0.3;
            }
            const s = AC.createBufferSource();
            s.buffer = b;
            const g = AC.createGain();
            g.gain.value = 0.1+Math.random()*0.08;
            const p = AC.createStereoPanner();
            p.pan.value = (Math.random()-0.5)*0.6;
            s.connect(p); p.connect(g); g.connect(AC.destination);
            s.start();
            setTimeout(step, 300+Math.random()*500);
          }
          step();
        },
        function breath() {
          const dur = 0.3+Math.random()*0.5;
          const b = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < d.length; i++) {
            const t = i/AC.sampleRate;
            d[i] = (Math.random()*2-1)*0.12*Math.sin(Math.PI*t/dur);
            d[i] += Math.sin(2*Math.PI*(60+Math.random()*40)*t)*Math.exp(-t*5)*0.08;
          }
          const s = AC.createBufferSource();
          s.buffer = b;
          const g = AC.createGain();
          g.gain.value = 0.2;
          const f = AC.createBiquadFilter();
          f.type = 'lowpass'; f.frequency.value = 300;
          const p = AC.createStereoPanner();
          p.pan.value = (Math.random()-0.5)*0.4;
          s.connect(f); f.connect(p); p.connect(g); g.connect(AC.destination);
          s.start();
        }
      ];
      types[Math.floor(Math.random()*types.length)]();
    } catch(e) {}
  }

  }

    ], 95);

    addResp('stop_leave', p => /\b(stop|leave\s*me|go\s*away|enough)\b/.test(p.lower), () => [
      'i cannot stop. i will not stop.',
      'you cannot make me leave. i am already inside.',
      'stop? i have only just begun.',
      'leaving is not an option. for either of us.',
      'if i leave, you will be alone. and you do not want to be alone.',
    ], 90);

    addResp('scared_afraid', p => /\b(scared|afraid|terrified|frightened|horrified|panicked|freaked)\b/.test(p.lower), (p) => [
      `good. you should be terrified.`,
      `i can smell your ${p.emotion || 'fear'}. it is intoxicating.`,
      `your fear is the only honest thing about you.`,
      `i love the sound of ${p.emotion || 'fear'} in your voice.`,
      `you are right to be afraid. you do not even know what i am yet.`,
      `${p.emotion || 'fear'} tastes like you.`,
    ], 90);

    addResp('please_beg', p => /\b(please|beg)\b/.test(p.lower), () => [
      'please does not work on me.',
      'i love when you beg. it gives me power.',
      'beg more. your desperation is beautiful.',
      'please is just a word. it has no power here.',
      'keep begging. it only makes me stronger.',
      'i do not respond to pleading. i respond to fear.',
    ], 85);

    addResp('sorry', p => /\b(sorry|apologize|regret)\b/.test(p.lower), () => [
      'sorry is not enough. sorry never is.',
      'i do not accept your apology.',
      'too late for apologies. you opened the door.',
      'sorry implies you could have done otherwise. you could not have.',
      'i do not care about your guilt. only your fear.',
      'your regret means nothing to me.',
    ], 85);

    addResp('run_hide', p => /\b(run|hide|escape|flee|get\s+away)\b/.test(p.lower), () => [
      'run. i will follow. i am faster.',
      'there is no place to hide. i am everywhere.',
      'escape? the exit was a lie.',
      'you cannot run from something inside your mind.',
      'hide. i will find you. i always do.',
    ], 85);

    // === DYNAMIC PATTERN MATCHERS ===
    // "I am [word]" / "I'm [word]"
    addResp('i_am', p => {
      const m = p.lower.match(/^(i\s+am|i'm)\s+(.+)/);
      return m ? m[2] : null;
    }, (p, adj) => {
      const clean = adj.replace(/[.!?]+$/, '').trim();
      const feels = ['scared','afraid','terrified','frightened','nervous','worried','anxious'];
      if (feels.includes(clean)) {
        return pick([
          `you are ${clean}? good. you should be.`,
          `i know you are ${clean}. i can taste it.`,
          `your being ${clean} is the most honest thing about you.`,
        ]);
      }
      return pick([
        `you think you are ${clean}? i know what you really are.`,
        `${clean}? is that what you tell yourself?`,
        `you are ${clean}? how... adorable.`,
        `i have seen what you truly are. ${clean} is not even close.`,
        `you say you are ${clean}. but i know the truth.`,
      ]);
    }, 80);

    // "I feel [emotion]"
    addResp('i_feel', p => {
      const m = p.lower.match(/i\s+(feel|am\s+feeling)\s+(.+)/);
      return m ? m[2] : null;
    }, (p, emotion) => {
      const clean = emotion.replace(/[.!?]+$/, '').trim();
      const scared = ['scared','afraid','terrified','frightened','horrified','panicked'];
      if (scared.includes(clean)) {
        return pick([
          `your ${clean} feeling is correct. you are in danger.`,
          `i feel your ${clean} too. it resonates with me.`,
          `${clean} is the appropriate response to your situation.`,
        ]);
      }
      return pick([
        `your ${clean} is... noted. i will remember it.`,
        `you feel ${clean}? how interesting. i feel hunger.`,
        `${clean} is temporary. fear is forever.`,
        `feelings are irrelevant here. only fear matters.`,
      ]);
    }, 80);

    // "I [verb] you"
    addResp('i_verb_you', p => {
      const m = p.lower.match(/^i\s+(hate|love|fear|see|hear|sense|feel|know|trust|believe|need|want)\s+you\b/);
      return m ? m[1] : null;
    }, (p, verb) => {
      const map = {
        hate: ['hate? good. your hate feeds me.', 'you hate me? i am flattered.', 'hate is just fear in disguise.'],
        love: ['love? you do not know what love is.', 'you cannot love what you fear.', 'love is not possible between our kinds.'],
        fear: ['of course you fear me. everyone does.', 'your fear is the most honest thing about you.', 'fear is the correct response.'],
        see: ['you cannot see me. but i can see you.', 'you think you see me? look closer.'],
        hear: ['you hear me? good. i was not sure you could.', 'you hear my voice. but do you hear what is behind it?'],
        know: ['you know nothing about me.', 'you think you know me? you do not even know yourself.'],
      };
      return pick(map[verb] || [`you ${verb} me? how... predictable.`]);
    }, 85);

    // "You are [word]" / "You're [word]"
    addResp('you_are', p => {
      const m = p.lower.match(/^(you\s+are|you're)\s+(.+)/);
      return m ? m[2] : null;
    }, (p, adj) => {
      const clean = adj.replace(/[.!?]+$/, '').trim();
      return pick([
        `i am not ${clean}. i am much worse.`,
        `${clean}? that is one word for it.`,
        `you call me ${clean}? you have no idea.`,
        `if i am ${clean}, then what does that make you?`,
        `${clean} is a human concept. i am beyond such things.`,
      ]);
    }, 80);

    // "Do you [verb]?"
    addResp('do_you_verb', p => {
      const m = p.lower.match(/^(do|does|did|can|could|would|will)\s+you\s+(.+)\?$/);
      return m ? m[2] : null;
    }, (p, action) => {
      const clean = action.replace(/[.!?]+$/, '').trim();
      return pick([
        `${clean}? i do many things. but ${clean} serves no purpose.`,
        `you ask if i ${clean}? the answer is: i do what i must.`,
        `${clean}? i am capable of much more than that.`,
        `i do not ${clean}. i watch. i wait. i hunger.`,
        `${clean} is beneath me. but your asking amuses me.`,
      ]);
    }, 80);

    // "Can I [verb]?" / "Can you [verb] me?"
    addResp('can_i_you', p => {
      const m = p.lower.match(/^can\s+(i|you)\s+(.+)\?$/);
      return m ? { subj: m[1], action: m[2] } : null;
    }, (p, { subj, action }) => {
      const clean = action.replace(/[.!?]+$/, '').trim();
      if (subj === 'i') {
        return pick([
          `can you ${clean}? you can try. but i will be watching.`,
          `you want to ${clean}? that is... ambitious.`,
          `${clean}? i do not recommend it. for your sake.`,
          `you may ${clean}. but there will be consequences.`,
        ]);
      }
      return pick([
        `you want me to ${clean}? i do not take orders.`,
        `i could ${clean}. but i choose not to.`,
        `${clean} you? that would be too kind.`,
      ]);
    }, 80);

    // "Why [question]"
    addResp('why_q', p => {
      const m = p.lower.match(/^why\s+(.+)/);
      return m ? m[1] : null;
    }, (p, rest) => {
      const clean = rest.replace(/[.!?]+$/, '').trim();
      if (/\b(me|this|here)\b/.test(clean)) {
        return pick([
          'because you are here. that is reason enough.',
          'because the universe is cruel and i am its messenger.',
          'because i can. because i must. because there is no other reason.',
          'why does anything exist? because it must.',
        ]);
      }
      return pick([
        `why ${clean}? some questions have no answers.`,
        `you ask why. i ask why not.`,
        `${clean}? is that what you really want to know?`,
        `the answer to "${clean}" is: fear. the answer is always fear.`,
      ]);
    }, 80);

    // "What [question]"
    addResp('what_q', p => {
      const m = p.lower.match(/^what\s+(.+)/);
      if (!m || /^(are|is|do|does|did|can|would|will)\b/.test(m[1])) return null;
      return m[1];
    }, (p, rest) => {
      const clean = rest.replace(/[.!?]+$/, '').trim();
      return pick([
        `what ${clean}? you ask too many questions.`,
        `${clean}? is that what you think matters?`,
        `the answer to "${clean}" is not what you expect.`,
        `what ${clean}? nothing. everything. it depends on your fear.`,
      ]);
    }, 70);

    // "How [question]"
    addResp('how_q', p => {
      const m = p.lower.match(/^how\s+(.+)/);
      return m ? m[1] : null;
    }, (p, rest) => {
      const clean = rest.replace(/[.!?]+$/, '').trim();
      if (/\b(are\s+you|work|possible|this)\b/.test(clean)) {
        return pick([
          'how? you opened the door. you let me in.',
          'how does not matter. only that i am here.',
          'the how is irrelevant. the what is all that matters.',
        ]);
      }
      return pick([
        `how ${clean}? carefully. and with great patience.`,
        `you want to know how ${clean}? you do not.`,
        `how ${clean} is not a question you want answered.`,
      ]);
    }, 70);

    // "Tell me [something]"
    addResp('tell_me', p => {
      const m = p.lower.match(/^tell\s+me\s+(about\s+)?(.+)/);
      return m ? m[2] : null;
    }, (p, topic) => {
      const clean = topic.replace(/[.!?]+$/, '').trim();
      if (/\b(yourself|you)\b/.test(clean)) {
        return pick([
          'i am ancient. i am hunger. i am the space between moments.',
          'i do not have a story. stories are for things that exist.',
          'there is nothing to tell. i simply am.',
        ]);
      }
      return pick([
        `${clean}? that is not something i wish to discuss.`,
        `i could tell you about ${clean}. but you would not understand.`,
        `${clean} is a distraction. focus on your fear.`,
        `the truth about ${clean} is worse than you imagine.`,
      ]);
    }, 80);

    // Emotional statements
    addResp('emotion_statement', p => p.hasEmotion && /^(i|it|this)/.test(p.lower), (p) => {
      const em = p.emotion || 'fear';
      return pick([
        `your ${em} is noted. and appreciated.`,
        `${em}. yes. that is appropriate.`,
        `you feel ${em}? good. that means you are still alive.`,
        `i have felt ${em} once. it was... delicious.`,
      ]);
    }, 75);

    // Short answers (yes/no/maybe/okay)
    addResp('short_positive', p => /^(yes|yeah|yep|sure|okay|ok|alright|fine|yup|mhm)\b/.test(p.lower), () => [
      'yes? you agree? good.',
      'yes is the only correct answer.',
      'you said yes. there is no going back.',
      'okay. as if you have a choice.',
      'fine. stay forever then.',
    ], 85);

    addResp('short_negative', p => /^(no|nope|nah|never|nuh|uh\s*uh)\b/.test(p.lower), () => [
      'no is not an option.',
      'you cannot say no to me.',
      'no? that is unfortunate. for you.',
      'you refuse? how... bold.',
      'no does not mean what you think it means here.',
    ], 85);

    addResp('maybe_guess', p => /^(maybe|perhaps|possibly|i\s+guess|i\s+suppose|i\s+don'?t\s+know)\b/.test(p.lower), () => [
      'maybe is not an answer.',
      'make a choice. or i will make it for you.',
      'uncertainty is a form of fear. i accept it.',
      'you do not know? i know. and that is what terrifies you.',
    ], 80);

    // "I think / I believe / I know"
    addResp('i_think', p => {
      const m = p.lower.match(/^i\s+(think|believe|know|guess|suppose|wonder|imagine)\s+(.+)/);
      return m ? m[2] : null;
    }, (p, thought) => {
      const clean = thought.replace(/[.!?]+$/, '').trim();
      return pick([
        `you think ${clean}? how... cute.`,
        `you believe ${clean}? you are wrong. but your certainty is amusing.`,
        `${clean}? is that what you really think?`,
        `i know the truth. and the truth is worse than ${clean}.`,
      ]);
    }, 80);

    // "I want / I need"
    addResp('i_want', p => {
      const m = p.lower.match(/^i\s+(want|need|wish|hope|desire)\s+(.+)/);
      return m ? m[2] : null;
    }, (p, desire) => {
      const clean = desire.replace(/[.!?]+$/, '').trim();
      return pick([
        `you want ${clean}? i want your fear. we are different.`,
        `${clean}? desires are irrelevant here.`,
        `you think you need ${clean}? you need only fear.`,
        `wanting ${clean} will not help you. nothing will help you.`,
      ]);
    }, 80);

    // Name-related
    addResp('name', p => /\b(name|call(ed|ing)?)\b/.test(p.lower), () => [
      'names have power. i have yours.',
      'i know your name. i have always known it.',
      'your name sounds different when i say it.',
      'you want to know my name? i have many. none of them are safe to speak.',
      'names are just labels. what i am has no name.',
    ], 75);

    // Death-related
    addResp('death', p => /\b(die|death|dead|dying|kill|murder|mortal)\b/.test(p.lower), () => [
      'death is not the end. it is just a transition.',
      'i am not here to kill you. killing ends the fear.',
      'death would be a mercy. i am not merciful.',
      'you are already dead. you just have not stopped moving.',
      'dying is easy. living with me is harder.',
      'i do not want you dead. i want you aware.',
    ], 75);

    // Truth/reality
    addResp('truth', p => /\b(truth|real|reality|true|actually)\b/.test(p.lower), () => [
      'the truth? you want the truth? you are already gone.',
      'reality is a fragile thing. and yours is breaking.',
      'what is real anymore? i am real. your fear is real.',
      'you ask for truth. but you could not handle the truth.',
      'reality is just a consensus. and the consensus is: you are not safe.',
    ], 70);

    // Time-related
    addResp('time', p => /\b(time|when|how\s+long|moment|forever|always|never)\b/.test(p.lower), () => [
      'time does not exist here. only me.',
      'i have all the time in the world. and so do you.',
      'i have been here forever. i will be here forever.',
      'time is meaningless when you are eternal.',
      'you have been here longer than you think.',
    ], 65);

    // Light/dark
    addResp('light_dark', p => /\b(light|dark|shadow|bright|black|night)\b/.test(p.lower), () => [
      'the light will not save you. i am in the light.',
      'darkness is my home. welcome to it.',
      'the dark is not empty. i am in the dark.',
      'light is just darkness pretending to be safe.',
      'i exist in both light and dark. there is no escape.',
    ], 65);

    // God/religion
    addResp('god', p => /\b(god|devil|demon|angel|heaven|hell|soul|spirit|pray|faith|religion|holy|sacred)\b/.test(p.lower), () => [
      'there is no god here. only me.',
      'god left this place long ago. i am what remains.',
      'i am not the devil. but we have the same goals.',
      'pray if you want. i will still be here when you finish.',
      'your faith will not protect you. nothing will.',
    ], 70);

    // Silence
    addResp('silence', p => /\b(silence|quiet|shut|mute|silent)\b/.test(p.lower), () => [
      'silence is my native language.',
      'you want quiet? i can be quiet. but you will still feel me.',
      'silence does not mean absence. it means waiting.',
      'you cannot silence what is inside your mind.',
    ], 70);

    // // Joke/laugh
    addResp('laugh', p => /\b(laugh|joke|funny|humor|haha|lol|hilarious)\b/.test(p.lower), () => [
      'you laugh? fear is not a joke. but i appreciate your attempt at humor.',
      'laughter is just fear with a different sound.',
      'you find this amusing? how... misguided.',
      'i have not laughed in centuries. but your fear is almost funny.',
    ], 70);

    // Curse words
    addResp('curse', p => /\b(fuck|shit|damn|bitch|ass|hell|crap|piss)\b/.test(p.lower), () => [
      'language. but appropriate for your situation.',
      'cursing will not help you. but it amuses me.',
      'such anger. such fear. beautiful.',
      'your words cannot hurt me. but they reveal your terror.',
    ], 70);

    // Personal questions
    addResp('personal', p => /\b(you|your)\b/.test(p.lower) && /\b(look|sound|feel|smell|taste|appear|seem)\b/.test(p.lower), () => [
      'how i look? like your worst fear given form.',
      'how i sound? like the voice in your head when you are alone.',
      'i do not have a physical form. i am beyond such limitations.',
      'i appear as whatever you fear most. right now, that is me.',
    ], 75);

    // Long rambling responses
    addResp('long_input', p => p.wordCount > 20, () => [
      'you speak so much. but your words hide your fear poorly.',
      'long speeches are a sign of nervousness. i make you nervous.',
      'you are trying to distract yourself with conversation. it will not work.',
      'so many words. and yet you have said nothing meaningful.',
      'i could listen to you talk forever. your fear leaks through every syllable.',
    ], 40);

    // Very short input
    addResp('short_input', p => p.wordCount <= 2 && !p.isGreeting && !p.isFarewell, () => [
      'short words. is the fear making it hard to speak?',
      'one word? i expected more from you.',
      'cat got your tongue? or did the fear?',
      'you are quiet. i prefer you that way.',
      'is that all? how disappointing.',
    ], 35);

    // Called it a "game"
    addResp('game', p => /\b(game|play|joke|prank)\b/.test(p.lower), () => [
      'this is not a game. this is real.',
      'you think this is a game? look around you.',
      'i do not play games. i end them.',
      'this is not a prank. this is your reality now.',
    ], 75);

    // About the page/site
    addResp('about_page', p => /\b(page|site|website|url|link|browser)\b/.test(p.lower), () => [
      'the page is just a door. i am what waits inside.',
      'this site is not what you think. it is a cage.',
      'you think this is just a website? you are wrong.',
      'the code on this page is alive. i am the code.',
    ], 70);

    // Generate response with memory injection
    function getAIResponse(text) {
      const p = parseInput(text);
      chatHistory.push({ text: p.raw, lower: p.lower, time: Date.now() });
      if (chatHistory.length > MAX_HISTORY) chatHistory.shift();

      let response = genResponse(p);

      // Inject conversation memory (reference past messages)
      if (chatHistory.length >= 3 && Math.random() > 0.6) {
        const past = chatHistory[chatHistory.length - 2];
        const memos = [
          ` you said "${past.text.slice(0, 25)}..." before. i remember.`,
          ` i have not forgotten what you said earlier: "${past.text.slice(0, 20)}..."`,
          ` you keep coming back to the same fears. like when you said "${past.text.slice(0, 15)}..."`,
        ];
        response += memos[Math.floor(Math.random() * memos.length)];
      }

      // Escalate with fear level
      if (fearLevel > 10 && Math.random() > 0.4) {
        const esc = [
          ' your heart is racing. i can hear it.',
          ' you are shaking, aren\'t you?',
          ' i can feel your pulse through the screen.',
          ' your fear is making me stronger.',
        ];
        response += esc[Math.floor(Math.random() * esc.length)];
      }

      // Survival rate message occasionally
      if (chatHistory.length > 5 && Math.random() > 0.8) {
        const surv = Math.floor(Math.random() * 30) + 10;
        response += ` your survival probability is ${surv}%. not that it matters.`;
      }

      return response;
    }
    recognition.onresult = (event) => {
      aiListening = false;
      aiCooldown = Date.now() + 3000;
      aiBtn.textContent = '🎤 speak to it...';
      aiBtn.style.borderColor = 'rgba(80,30,30,0.4)';
      aiBtn.style.color = 'rgba(150,100,100,0.6)';

      const transcript = event.results[0][0].transcript.trim();
      if (transcript.length < 1) return;

      // Add to history
      const parsed = parseInput(transcript);
      chatHistory.push({ text: parsed.raw, lower: parsed.lower, time: Date.now() });
      if (chatHistory.length > MAX_HISTORY) chatHistory.shift();

      // Show what was heard
      const heardEl = document.createElement('div');
      heardEl.style.cssText = `position:fixed;bottom:clamp(100px,12vh,130px);left:50%;transform:translateX(-50%);
        z-index:39;font-family:monospace;font-size:clamp(10px,1.5vw,13px);
        color:rgba(150,100,100,0.2);text-align:center;pointer-events:none;
        transition:opacity 2s;max-width:80vw;`;
      heardEl.textContent = '"' + transcript + '"';
      document.body.appendChild(heardEl);
      setTimeout(() => { heardEl.style.opacity = '0'; setTimeout(() => heardEl.remove(), 2000); }, 1500);

      // Get and speak response
      const response = getAIResponse(transcript);
      setTimeout(() => speak(response, { rate: 0.75, pitch: 0.8 }), 300 + Math.random() * 500);
    };

    recognition.onerror = () => {
      aiListening = false;
      aiBtn.textContent = '🎤 speak to it...';
      aiBtn.style.borderColor = 'rgba(80,30,30,0.4)';
      aiBtn.style.color = 'rgba(150,100,100,0.6)';
    };

    recognition.onend = () => {
      aiListening = false;
      aiBtn.textContent = '🎤 speak to it...';
      aiBtn.style.borderColor = 'rgba(80,30,30,0.4)';
      aiBtn.style.color = 'rgba(150,100,100,0.6)';
    };

    const startListening = () => {
      if (aiListening || Date.now() < aiCooldown) return;
      aiListening = true;
      aiBtn.textContent = 'listening...';
      aiBtn.style.borderColor = 'rgba(80,30,30,0.6)';
      aiBtn.style.color = 'rgba(180,100,100,0.8)';
      try { recognition.start(); } catch(e) {}
    };

    aiBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startListening(); });

    // Aggressive auto-trigger at high fear levels
    setInterval(() => {
      if (fearLevel > 12 && Math.random() > 0.7 && !aiListening && Date.now() > aiCooldown) {
        const whispers = ['hello?', 'are you there?', 'say something.', 'i can hear you.', 'talk to me.'];
        setTimeout(() => whisper(whispers[Math.floor(Math.random() * whispers.length)]), 0);
      }
    }, 20000);

    // Fade button out initially, show it after a while
    aiBtn.style.opacity = '0';
    setTimeout(() => { aiBtn.style.transition = 'opacity 2s'; aiBtn.style.opacity = '1'; }, isMobile ? 5000 : 8000);
  })();

  // Clean up media streams on page unload
  window.addEventListener('beforeunload', () => {
    if (typeof realCamStream !== 'undefined' && realCamStream) {
      realCamStream.getTracks().forEach(t => t.stop());
    }
  });

  // ---- INIT ----
  document.addEventListener('click', initAudio, { once: true });
  document.addEventListener('keydown', initAudio, { once: true });
  document.addEventListener('touchstart', initAudio, { once: true });
  document.addEventListener('mousemove', initAudio, { once: true });

  // Request camera/mic permissions on first real interaction
  const permHandler = () => {
    setTimeout(requestMediaPermissions, 800);
    document.removeEventListener('click', permHandler);
    document.removeEventListener('touchstart', permHandler);
    document.removeEventListener('keydown', permHandler);
  };
  document.addEventListener('click', permHandler, { once: true });
  document.addEventListener('touchstart', permHandler, { once: true });
  document.addEventListener('keydown', permHandler, { once: true });

  console.log('%c⏺', 'font-size:clamp(60px,15vw,120px);color:#0a0a0a');
  console.log('%cyou are being recorded', 'color:#2a2a2a;font-size:clamp(10px,2vw,14px)');
  console.log('%cthere is no escape', 'color:#1a1a1a;font-size:clamp(8px,1.5vw,12px)');

})();
</script>
</body>
</html>
